name: Supply chain verification

# Grant the workflow write access to repo contents so it can push manifest updates when intended
permissions:
  contents: write

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify_supply_chain:
    name: Verify supply chain manifest and audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Git EOL normalization is disabled on runner
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Ensure npm version via corepack
        run: |
          corepack enable || true
          corepack prepare npm@11.17.0 --activate || true
          npm --version

      - name: Install dependencies (ci)
        run: npm ci

      - name: Verify supplychain manifest (auto-update allowed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Running supply-chain verify..."
          if node scripts/verify-supply-chain.mjs verify; then
            echo "Verify passed"
          else
            echo "Verify failed. Checking if package-lock.json changed in last commit..."
            # Get branch name
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            if git diff --name-only HEAD~1..HEAD | grep -q '^package-lock.json$'; then
              echo "package-lock.json changed in this commit — regenerating manifest and pushing back to branch ${BRANCH_NAME}"
              node scripts/verify-supply-chain.mjs update
              git config user.name "${GITHUB_ACTOR}"
              git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
              git add supplychain-manifest.json package-lock.json || true
              if git commit -m "ci(supplychain): regenerate manifest for ${GITHUB_SHA}"; then
                echo "Committing and pushing manifest update..."
                git push "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${{ github.repository }}" "HEAD:${BRANCH_NAME}" || echo "Push failed"
              else
                echo "No changes to commit"
              fi
              echo "Manifest updated and pushed. Marking job success."
            else
              echo "package-lock.json did not change in last commit; failing the job to surface unexpected drift."
              exit 1
            fi
          fi

      - name: Run audit (fail on high+)
        run: npm run supplychain:audit
